[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medimg-annotator"
version = "2.2.0"
description = "Interactive 2D/3D medical image segmentation, object detection, and preprocessing workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "nibabel>=3.2.0",
    "numpy>=1.20.0,<2.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "Pillow>=8.0.0",
    "pandas>=1.3.0",
    "dicom2nifti>=2.3.0",
    "pydicom>=2.2.0",
    "scikit-image>=0.18.0",
    "openpyxl>=3.0.0",
    "opencv-python>=4.5.0",
    "SimpleITK>=2.1.0",
]

[project.optional-dependencies]
tiff = ["tifffile>=2021.11.0"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
medimg-annotator = "medimg_annotator.app:run_app"

[project.urls]
Homepage = "https://github.com/EwunateAssaye/MedImgAnnotator"
Paper = "https://arxiv.org/abs/2611.22450"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--capture=sys"
